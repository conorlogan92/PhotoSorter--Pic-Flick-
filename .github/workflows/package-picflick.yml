name: Package PicFlick for macOS and Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and collect platform dependencies
        run: |
          mvn -B -DskipTests package dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/package-input
          jar --create --file target/package-input/PicFlick.jar -C target/classes .
      - name: Create native icon
        run: |
          python -m pip install pillow
          python scripts/make_icons.py
      - name: Build Mac app and DMG
        run: |
          mkdir -p target/installers
          jpackage --type dmg --name PicFlick --app-version 1.0.0 \
            --input target/package-input --dest target/installers \
            --main-jar PicFlick.jar --main-class PicFlickLauncher \
            --icon target/icons/PicFlick.icns \
            --mac-package-identifier com.picflick.app
      - uses: actions/upload-artifact@v4
        with:
          name: PicFlick-macOS-Apple-Silicon
          path: target/installers/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and collect platform dependencies
        shell: pwsh
        run: |
          mvn -B -DskipTests package dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/package-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          jar --create --file target/package-input/PicFlick.jar -C target/classes .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create native icon
        shell: pwsh
        run: |
          python -m pip install pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/make_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/installers | Out-Null
          jpackage --type exe --name PicFlick --app-version 1.0.0 `
            --input target/package-input --dest target/installers `
            --main-jar PicFlick.jar --main-class PicFlickLauncher `
            --icon target/icons/PicFlick.ico --win-menu --win-shortcut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: PicFlick-Windows-Installer
          path: target/installers/*.exe
          if-no-files-found: error
